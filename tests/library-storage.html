<!doctype html>
<meta charset="utf-8">
<title>Library cursor integration</title>
<output id="result">Running</output>
<script type="module">
  import { readLibraryPage, readDownloadRows } from '../library-storage.mjs';
  const result = document.querySelector('#result');
  const name = `xvault-cursor-test-${crypto.randomUUID()}`;
  try {
    const database = await new Promise((resolve, reject) => {
      const request = indexedDB.open(name, 1);
      request.onupgradeneeded = () => {
        request.result.createObjectStore('tweets', { keyPath: 'id' });
        const downloads = request.result.createObjectStore('downloads', { keyPath: 'key' });
        downloads.createIndex('tweetId', 'item.tweetId');
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
    await new Promise((resolve, reject) => {
      const tx = database.transaction('tweets', 'readwrite');
      for (const id of ['1', '2', '3', '4', '5']) tx.objectStore('tweets').put({ id, text: `Post ${id}` });
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
    await new Promise((resolve, reject) => {
      const tx = database.transaction('downloads', 'readwrite');
      tx.objectStore('downloads').put({ key: 'a', item: { tweetId: '2' }, state: 'complete' });
      tx.objectStore('downloads').put({ key: 'b', item: { tweetId: '4' }, state: 'failed' });
      tx.objectStore('downloads').put({ key: 'c', item: { tweetId: '5' }, state: 'queued' });
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
    const first = await readLibraryPage(database, undefined, 2);
    const second = await readLibraryPage(database, first.nextKey, 2);
    const third = await readLibraryPage(database, second.nextKey, 2);
    if (JSON.stringify([first.rows.map(x => x.id), second.rows.map(x => x.id), third.rows.map(x => x.id)]) !== JSON.stringify([['1','2'],['3','4'],['5']])) throw Error('Incorrect page order or duplicate row');
    if (first.done || second.done || !third.done) throw Error('Incorrect completion state');
    const selected = await readDownloadRows(database, ['2', '5']);
    if (JSON.stringify(selected.map(row => row.key)) !== JSON.stringify(['a', 'c'])) throw Error('Download scan included wrong posts');
    database.close();
    indexedDB.deleteDatabase(name);
    result.textContent = 'PASS';
  } catch (error) {
    result.textContent = `FAIL: ${error.message}`;
  }
</script>

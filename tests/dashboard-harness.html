<!doctype html>
<meta charset="utf-8" />
<title>XVault dashboard smoke harness</title>
<link rel="icon" href="../icons/icon16.png" />
<style>
  html,
  body {
    margin: 0;
    height: 100%;
    background: #090b0e;
  }
  iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }
</style>
<iframe title="XVault dashboard under test"></iframe>
<script>
  (async () => {
    const source = await fetch(`../dashboard.html?smoke=${Date.now()}`).then(response => response.text());
    const base = `${location.origin}/`;
    const mock = new URLSearchParams(location.search).has('idb') ? 'chrome-mock-idb.js' : 'chrome-mock.js';
    const html = source.replace(
      '<head>',
      `<head><base href="${base}"><script src="tests/${mock}?smoke=${Date.now()}"><\/script>`
    );
    document.querySelector('iframe').srcdoc = html;
  })();
</script>

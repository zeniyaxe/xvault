name: CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run format:check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python helper syntax
        run: python -m py_compile FFmpeg_Helper/*.py
      - name: Python helper tests
        run: python -m unittest discover -s tests/python -v
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: xvault-extension
          path: dist/*.zip
          if-no-files-found: error
  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i --no-save playwright@1
      - run: npx playwright install --with-deps chromium
      - name: Load extension, render pages, exercise Library + exports
        run: npm run e2e
      - name: Accessibility audit (axe-core, WCAG 2.1 A/AA; serious and critical fail)
        run: npm run e2e:a11y
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: |
            output/e2e/
            output/a11y/

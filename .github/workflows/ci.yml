name: CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run format:check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python helper dependencies
        # The Remote companion's TLS certificate and thumbnails need these (see requirements-remote.txt);
        # PyInstaller is only for packaging and is not installed here.
        run: python -m pip install "cryptography>=44" "Pillow>=10"
      - name: Python helper syntax
        run: python -m py_compile FFmpeg_Helper/*.py
      - name: Python helper tests
        run: |
          python -m unittest discover -s tests/python -v
          python -m unittest discover -s tests -p 'test_*.py' -v
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: xvault-extension
          path: dist/*.zip
          if-no-files-found: error
  firefox:
    # Firefox package: build it, run Mozilla's linter (errors fail; warnings are reported) and run it in a real
    # headless Firefox (scripts/e2e-firefox.py).
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -- --target=firefox
      - name: web-ext lint
        run: |
          mkdir -p output/firefox && unzip -q dist/XVault-*-firefox.zip -d output/firefox
          npx --yes web-ext@8 lint --source-dir output/firefox --output json > web-ext-lint.json || true
          node -e "const r=require('./web-ext-lint.json');console.log(r.summary);for(const e of r.errors)console.log('::error file='+(e.file||'manifest.json')+'::'+e.code+' '+e.message);if(r.errors.length)process.exit(1)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install selenium
      - name: Real Firefox e2e (temporary add-on via geckodriver)
        run: python scripts/e2e-firefox.py dist/XVault-*-firefox.zip
      - uses: actions/upload-artifact@v4
        with:
          name: xvault-firefox
          path: |
            dist/*-firefox.zip
            web-ext-lint.json
  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i --no-save playwright@1
      - run: npx playwright install --with-deps chromium
      - name: Load extension, render pages, exercise Library + exports
        run: npm run e2e
      - name: Helper file operations against the real Python helper (rename, hard-link dedupe)
        run: node tests/helper-files-browser.mjs playwright
      - name: Scheduled backups through the real offscreen document (plaintext, encrypted, retention)
        run: node tests/auto-backup-browser.mjs playwright
      - name: Downloads page against real Chromium downloads (honest progress, persistent pause, filters, retry)
        run: node tests/downloads-page-browser.mjs playwright
      - name: Accessibility audit (axe-core, WCAG 2.1 A/AA; serious and critical fail)
        run: npm run e2e:a11y
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: |
            output/e2e/
            output/a11y/
